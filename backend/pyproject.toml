[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yfen-backend"
version = "0.1.0"
description = "YFEN AI Business Control Tower API"
requires-python = ">=3.12"
dependencies = [
  "Django==6.1.3",
  "djangorestframework==3.18.3",
  "django-cors-headers==4.9.0",
  "django-filter==25.2",
  "drf-spectacular==0.29.0",
  "psycopg[binary]==3.2.12",
  "celery[redis]==5.5.3",
  "openpyxl==3.1.5",
  "pdfplumber==0.11.9",
  "gunicorn==23.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-django==4.11.1", "ruff==0.14.4", "coverage==7.11.0"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["DJ001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "apps*"]
